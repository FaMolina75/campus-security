<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Security - Panel de Profesor</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 para alertas modernas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; }
        .navbar-custom { background-color: #1e293b; color: white; }
        .card-custom { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        .btn-calificar { background-color: #3b82f6; color: white; }
        .btn-calificar:hover { background-color: #2563eb; color: white; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-white fw-bold" href="#">
                <i class="fa-solid fa-shield-halved me-2"></i>Campus Security | Profesor
            </a>
            <div class="d-flex align-items-center">
                <span id="nombre-profesor" class="me-4 fw-medium text-light">Cargando...</span>
                <button onclick="cerrarSesion()" class="btn btn-outline-light btn-sm">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        
        <!-- SECCIÓN 1: LISTA DE GRUPOS -->
        <div id="seccion-grupos">
            <h3 class="fw-bold mb-4 text-secondary"><i class="fa-solid fa-users-rectangle me-2"></i>Mis Grupos Asignados</h3>
            <div class="row" id="contenedor-grupos">
                <!-- Los grupos se inyectarán aquí con JavaScript -->
            </div>
        </div>

        <!-- SECCIÓN 2: LISTA DE ALUMNOS (Oculta por defecto) -->
        <div id="seccion-alumnos" style="display: none;">
            <button onclick="volverAGrupos()" class="btn btn-secondary mb-3">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver a mis grupos
            </button>
            <div class="card card-custom p-4">
                <h4 class="fw-bold text-primary mb-1" id="titulo-materia">Materia</h4>
                <p class="text-muted mb-4" id="subtitulo-grupo">Grupo: -- | Horario: --</p>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Matrícula</th>
                                <th>Nombre del Alumno</th>
                                <th>Calificación</th>
                                <th>Estatus</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-alumnos">
                            <!-- Los alumnos se inyectarán aquí -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // URL de tu backend en Render
        const API_URL = "https://campus-security-v4zh.onrender.com/api";
        let usuarioActual = null;

        // 1. Validar Sesión al cargar la página
        document.addEventListener("DOMContentLoaded", () => {
            const usuarioJSON = localStorage.getItem('usuario');
            if (!usuarioJSON) {
                window.location.href = 'login.html'; // Cambia esto por tu página de login real
                return;
            }
            
            usuarioActual = JSON.parse(usuarioJSON);
            
            // Validar que realmente sea profesor
            if (usuarioActual.rol !== 'profesor') {
                alert("Acceso denegado. No eres profesor.");
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('nombre-profesor').innerText = `Prof. ${usuarioActual.nombre}`;
            cargarGrupos();
        });

        // 2. Obtener y Mostrar los Grupos del Profesor
        async function cargarGrupos() {
            try {
                const response = await fetch(`${API_URL}/profesor/grupos/${usuarioActual.id_usuario}`);
                const grupos = await response.json();
                
                const contenedor = document.getElementById('contenedor-grupos');
                contenedor.innerHTML = '';

                if (grupos.length === 0) {
                    contenedor.innerHTML = `<div class="alert alert-info">No tienes grupos asignados en este momento.</div>`;
                    return;
                }

                grupos.forEach(grupo => {
                    const card = `
                        <div class="col-md-4 mb-4">
                            <div class="card card-custom h-100">
                                <div class="card-body">
                                    <h5 class="card-title fw-bold text-primary">${grupo.nombre_materia}</h5>
                                    <h6 class="card-subtitle mb-3 text-muted">${grupo.carrera}</h6>
                                    <p class="card-text mb-1"><i class="fa-regular fa-clock me-2"></i><strong>Horario:</strong> ${grupo.horario}</p>
                                    <p class="card-text mb-1"><i class="fa-solid fa-door-open me-2"></i><strong>Aula:</strong> ${grupo.aula}</p>
                                    <p class="card-text mb-3"><i class="fa-solid fa-layer-group me-2"></i><strong>Grupo:</strong> ${grupo.nombre_grupo}</p>
                                    <button onclick="verAlumnos(${grupo.id_grupo}, '${grupo.nombre_materia}', '${grupo.nombre_grupo}', '${grupo.horario}')" class="btn btn-calificar w-100">
                                        <i class="fa-solid fa-list-check me-1"></i> Ver Alumnos y Calificar
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += card;
                });
            } catch (error) {
                Swal.fire('Error', 'No se pudieron cargar los grupos', 'error');
                console.error(error);
            }
        }

        // 3. Obtener y Mostrar los Alumnos de un Grupo Específico
        async function verAlumnos(idGrupo, materia, grupo, horario) {
            document.getElementById('seccion-grupos').style.display = 'none';
            document.getElementById('seccion-alumnos').style.display = 'block';
            
            document.getElementById('titulo-materia').innerText = materia;
            document.getElementById('subtitulo-grupo').innerText = `Grupo: ${grupo} | Horario: ${horario}`;
            
            const tbody = document.getElementById('tabla-alumnos');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center">Cargando alumnos...</td></tr>';

            try {
                const response = await fetch(`${API_URL}/profesor/grupo/${idGrupo}/alumnos`);
                const alumnos = await response.json();
                
                tbody.innerHTML = '';
                
                if (alumnos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">No hay alumnos inscritos en este grupo aún.</td></tr>';
                    return;
                }

                alumnos.forEach(alumno => {
                    // Pre-seleccionar el estatus actual
                    const selectCursando = alumno.estatus === 'Cursando' ? 'selected' : '';
                    const selectAprobada = alumno.estatus === 'Aprobada' ? 'selected' : '';
                    const selectReprobada = alumno.estatus === 'Reprobada' ? 'selected' : '';
                    
                    const califValue = alumno.calificacion !== null ? alumno.calificacion : '';

                    const fila = `
                        <tr>
                            <td class="fw-bold">${alumno.matricula}</td>
                            <td>${alumno.nombre}</td>
                            <td>
                                <input type="number" id="calif-${alumno.id_kardex}" class="form-control form-control-sm" value="${califValue}" min="0" max="100" placeholder="0 - 100">
                            </td>
                            <td>
                                <select id="estatus-${alumno.id_kardex}" class="form-select form-select-sm">
                                    <option value="Cursando" ${selectCursando}>Cursando</option>
                                    <option value="Aprobada" ${selectAprobada}>Aprobada</option>
                                    <option value="Reprobada" ${selectReprobada}>Reprobada</option>
                                </select>
                            </td>
                            <td>
                                <button onclick="guardarCalificacion(${alumno.id_kardex}, '${alumno.nombre}')" class="btn btn-success btn-sm">
                                    <i class="fa-solid fa-floppy-disk"></i> Guardar
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += fila;
                });
            } catch (error) {
                Swal.fire('Error', 'No se pudieron cargar los alumnos', 'error');
            }
        }

        // 4. Guardar la Calificación mediante POST al Backend
        async function guardarCalificacion(idKardex, nombreAlumno) {
            const calificacionInput = document.getElementById(`calif-${idKardex}`).value;
            const estatusInput = document.getElementById(`estatus-${idKardex}`).value;

            if (calificacionInput === '') {
                Swal.fire('Atención', 'Ingresa una calificación válida', 'warning');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/profesor/calificar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id_kardex: idKardex,
                        calificacion: parseFloat(calificacionInput),
                        estatus: estatusInput
                    })
                });

                const resultado = await response.json();

                if (response.ok) {
                    Swal.fire({
                        title: '¡Guardado!',
                        text: `Calificación de ${nombreAlumno} actualizada.`,
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire('Error', resultado.error, 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'Ocurrió un problema de red', 'error');
            }
        }

        // 5. Utilidades de la interfaz
        function volverAGrupos() {
            document.getElementById('seccion-alumnos').style.display = 'none';
            document.getElementById('seccion-grupos').style.display = 'block';
        }

        function cerrarSesion() {
            localStorage.removeItem('usuario');
            window.location.href = 'login.html'; // Cambia por tu archivo de login
        }
    </script>
</body>
</html>
