name: SecurityCampus antibot tests
on:
  pull_request:
    paths:
      - 'backend/app.py'
      - 'tests/test_recaptcha_security.py'
      - '.github/workflows/antibot-tests.yml'
  push:
    branches:
      - security/capa-1-antibots
jobs:
  recaptcha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: pip install Flask==3.1.3 flask-cors==6.0.5 Flask-Limiter==3.8.0 mysql-connector-python==26.7.0 requests==2.34.2 redis==5.2.1
      - name: Run isolated security and HTTP tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
