name: SecurityCampus antibot tests
on:
  pull_request:
    paths:
      - 'backend/app.py'
      - 'tests/test_recaptcha_security.py'
      - '.github/workflows/antibot-tests.yml'
  push:
    branches:
      - security/capa-1-antibots
jobs:
  recaptcha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated security tests
        run: python -m unittest discover -s tests -p 'test_recaptcha_security.py' -v
